# Phase 0: unsigned builds only (CI uploads `--dir` output per PR).
# Signing, notarisation, NSIS/DMG targets and the update feed are configured
# in Phase 11–12 — see docs/HOSTING.md and docs/EXTERNAL_INTEGRATIONS.md.
appId: app.churchmedia.desktop
productName: Church Media
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# LGPL ffmpeg/ffprobe for this platform (see resources/ffmpeg/README.md).
# Only the target platform's binaries are copied; an empty folder is fine
# (imports then work without probing, posters or conversion).
extraResources:
  - from: resources/ffmpeg/${os}-${arch}
    to: ffmpeg/${os}-${arch}
    filter: ["**/*", "!README.md"]
mac:
  category: public.app-category.productivity
  target: [dir]
win:
  target: [dir]
linux:
  target: [dir]
